[project]
name = "skyecho-monitor"
version = "1.0.0"
description = "SkyEcho GDL90 ADS-B Monitor with Rich TUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ifaddr==0.2.0",
    "rich>=13.0.0",
]

[project.scripts]
skyecho = "skyechogdl:main"
skyecho-monitor = "skyecho_rich_monitor:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.hatch.build.targets.wheel]
packages = ["skyechogdl", "skyecho_rich_monitor"]